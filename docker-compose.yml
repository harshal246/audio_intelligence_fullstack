version: "3.9"

services:
  # ── PostgreSQL with pgvector extension ─────────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: audio_intel_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=audio_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis for Celery & caching ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: audio_intel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # ── FastAPI Backend API ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audio_intel_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/audio_intelligence
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

  # ── Celery Background Worker (Embedding & Audio Processing) ────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audio_intel_worker
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/audio_intelligence
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app worker --loglevel=info
    restart: always

  # ── Frontend Web Application ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: audio_intel_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
